services:
  postgres:
    image: postgres:18-alpine
    # Loads the statement statistics module so Admin → Database can rank statements once `CREATE EXTENSION pg_stat_statements` has been run.
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: jularr
      POSTGRES_USER: jularr
      POSTGRES_PASSWORD: ${JULARR_DB_PASSWORD:?Set JULARR_DB_PASSWORD in .env}
    volumes:
      - jularr-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jularr -d jularr"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - default

  jularr:
    image: ghcr.io/juloc/jularr:${JULARR_VERSION:?Set JULARR_VERSION to an immutable release tag}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=jularr;Username=jularr;Password=${JULARR_DB_PASSWORD:?Set JULARR_DB_PASSWORD in .env}
      TranslateGemma__Endpoint: ${TRANSLATEGEMMA_ENDPOINT:-}
      TranslateGemma__Model: ${TRANSLATEGEMMA_MODEL:-translategemma-12b-it}
      TranslateGemma__MaxChunkCharacters: ${TRANSLATEGEMMA_MAX_CHUNK_CHARACTERS:-1200}
      TranslateGemma__TimeoutMinutes: ${TRANSLATEGEMMA_TIMEOUT_MINUTES:-30}
    volumes:
      - jularr-data:/data
    ports:
      - "8097:8080"
    networks:
      - default

  translategemma:
    image: ollama/ollama:latest
    profiles: ["translategemma"]
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        server=$$!
        until ollama list >/dev/null 2>&1; do sleep 1; done
        ollama pull "$$OLLAMA_TAG" && ollama cp "$$OLLAMA_TAG" "$$JULARR_MODEL"
        wait $$server
    environment:
      OLLAMA_TAG: ${TRANSLATEGEMMA_OLLAMA_TAG:-translategemma:12b}
      JULARR_MODEL: ${TRANSLATEGEMMA_MODEL:-translategemma-12b-it}
      OLLAMA_KEEP_ALIVE: "-1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_CONTEXT_LENGTH: "4096"
    volumes:
      - translategemma-models:/root/.ollama
    mem_limit: ${TRANSLATEGEMMA_MEMORY_LIMIT:-12g}
    networks:
      - default

volumes:
  jularr-data:
  jularr-postgres:
  translategemma-models:
