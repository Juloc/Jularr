# Jularr with PostgreSQL: image, port and volumes; every feature works without further settings.
# Copy .env.example to .env, set the release and a long database password, then `docker compose up -d`.
services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: jularr
      POSTGRES_USER: jularr
      POSTGRES_PASSWORD: ${JULARR_DB_PASSWORD:?Set JULARR_DB_PASSWORD in .env}
    volumes:
      - jularr-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jularr -d jularr"]
      interval: 5s
      timeout: 5s
      retries: 20

  jularr:
    image: ghcr.io/juloc/jularr:${JULARR_VERSION:?Set JULARR_VERSION in .env}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      JULARR_DB: Host=postgres;Database=jularr;Username=jularr;Password=${JULARR_DB_PASSWORD}
      # A browser that already runs, for the sources that put a browser check in front of their pages.
      Browser__RemoteAddress: ${JULARR_BROWSER_ADDRESS:-}
      # Optional existing private Ollama runtime; no model weights or runtime in the Jularr image.
      LocalTranslation__Endpoint: ${JULARR_OLLAMA_ENDPOINT:-}
      LocalTranslation__OperatorVerifiedFreeBytes: ${JULARR_OLLAMA_VERIFIED_FREE_BYTES:-0}
      # Opt-in LAN discovery only; publish the actual externally reachable web port.
      DeviceDiscovery__Enabled: ${JULARR_TV_DISCOVERY:-false}
      DeviceDiscovery__WebPort: ${JULARR_TV_WEB_PORT:-8097}
      DeviceDiscovery__Name: ${JULARR_TV_NAME:-Jularr}
      DeviceDiscovery__Https: ${JULARR_TV_HTTPS:-false}
    ports:
      - "8097:8080"
      # Only local-network clients: UDP 37812 for optional Android TV discovery.
      - "37812:37812/udp"
    volumes:
      - jularr-data:/data
      - ${JULARR_MEDIA:-./media}:/media

volumes:
  jularr-data:
  jularr-postgres:
