project: Jularr
repository: Juloc/Jularr
validation:
  - dotnet restore Jularr.sln
  - dotnet build Jularr.sln --no-restore
  - dotnet test Jularr.sln --no-build
protectedPaths:
  - AGENTS.md
  - docs/DEVELOPMENT.md
  - .agent/project.yaml
notes:
  - "The validation list is the release / explicit-full-validation gate, not ordinary slice completion."
  - "Working rules live in AGENTS.md; commands and code rules in docs/DEVELOPMENT.md."
