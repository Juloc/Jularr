name: Documentation

on:
  # Every pull request: code changes can break documented paths.
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  links-and-status:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - name: Verify documentation links, paths, sizes and duplicates
        run: node scripts/verify-documentation.mjs
