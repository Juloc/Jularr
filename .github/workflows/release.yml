name: Release

# A release is a git tag `v<MAJOR>.<MINOR>.<PATCH>[-prerelease]` on a commit of main. Nothing here runs on branches.
# The tag builds the image from the tagged commit, pushes it to GHCR and creates the GitHub release; see docs/RELEASE.md.
# workflow_dispatch rehearses everything except the push and the release: with dry_run the image is built and not published.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build the image, publish nothing (a branch may be chosen; publishing needs a version tag)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/juloc/jularr

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      dry_run: ${{ steps.check.outputs.dry_run }}
      tag: ${{ steps.check.outputs.tag }}
      version: ${{ steps.check.outputs.version }}
      minor: ${{ steps.check.outputs.minor }}
      prerelease: ${{ steps.check.outputs.prerelease }}
      tv_changed: ${{ steps.check.outputs.tv_changed }}
      previous_tv_release: ${{ steps.check.outputs.previous_tv_release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check tag, branch and test runs of the tagged commit
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"

          if [[ "${REF_TYPE}" == "tag" ]]; then
            tag="${REF_NAME}"
            semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$'
            if ! [[ "${tag}" =~ ${semver} ]]; then
              echo "::error::Tag ${tag} is not v<MAJOR>.<MINOR>.<PATCH> or v<MAJOR>.<MINOR>.<PATCH>-<prerelease>."
              exit 1
            fi
            version="${tag#v}"
            minor="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
            prerelease=false
            [[ -z "${BASH_REMATCH[4]}" ]] || prerelease=true
          elif [[ "${DRY_RUN}" == "true" ]]; then
            # A rehearsal from a branch has no version; it still has to pass every other check.
            tag=""; version="0.0.0-dryrun"; minor="0.0"; prerelease=true
          else
            echo "::error::Publishing runs from a version tag (v0.2.0), not from ${REF_NAME}. Choose the tag, or keep dry_run on."
            exit 1
          fi

          reachable=false
          for branch in main; do
            if git rev-parse --verify --quiet "refs/remotes/origin/${branch}" > /dev/null \
                && git merge-base --is-ancestor "${sha}" "refs/remotes/origin/${branch}"; then
              reachable=true
            fi
          done
          if [[ "${reachable}" != "true" ]]; then
            echo "::error::Commit ${sha} is not on origin/main. Tag a commit that was merged."
            exit 1
          fi

          # The owner can release past a red Backend Full once, in writing: the annotated tag message carries the line
          # "Gate override by owner: <reason>". Frontend always has to be green; the override is shown in the run.
          override=""
          if [[ "${REF_TYPE}" == "tag" ]]; then
            override="$(git for-each-ref "refs/tags/${tag}" --format='%(contents)' | sed -n 's/^Gate override by owner: *\(.\+\)$/\1/p' | head -1)"
          fi

          # The newest completed run of each workflow for exactly this commit must have succeeded.
          failed=false
          for workflow in "Frontend" "Backend Full"; do
            run="$(gh run list --commit "${sha}" --workflow "${workflow}" --limit 50 \
              --json status,conclusion,createdAt,url \
              --jq 'map(select(.status == "completed")) | sort_by(.createdAt) | last // empty | [.conclusion, .url] | @tsv')"
            if [[ -z "${run}" ]]; then
              echo "::error::No completed ${workflow} run for ${sha}. Let it finish or start it (see docs/RELEASE.md)."
              failed=true
            elif [[ "${run%%$'\t'*}" != "success" ]]; then
              if [[ "${workflow}" == "Backend Full" && -n "${override}" ]]; then
                echo "::warning::Released past a ${run%%$'\t'*} Backend Full run (${run#*$'\t'}) by the owner's written override: ${override}"
              else
                echo "::error::The latest ${workflow} run for ${sha} is ${run%%$'\t'*}: ${run#*$'\t'}"
                failed=true
              fi
            else
              echo "${workflow}: success (${run#*$'\t'})"
            fi
          done
          [[ "${failed}" == "false" ]] || exit 1

          # Compare the tagged tree with the version of the last published
          # signed TV APK, not with the last server release. Server-only releases
          # carry forward that APK unchanged and must never rerun TV tests.
          tv_changed=true
          previous_tv_release=""
          if [[ "${DRY_RUN}" != "true" ]]; then
            release_assets="$(gh api "repos/${GH_REPO}/releases?per_page=100" |
              jq -r --argjson include_prerelease "${prerelease}" '
                .[] |
                select(.draft == false and ($include_prerelease or (.prerelease | not))) |
                .tag_name as $release_tag |
                .assets[]? |
                select(.name | startswith("Jularr-TV-") and endswith(".apk")) |
                [$release_tag, .name] | @tsv
              ')"

            while IFS=$'\t' read -r candidate_release candidate_apk; do
              [[ -n "${candidate_release}" && "${candidate_release}" != "${tag}" ]] || continue
              candidate_version="${candidate_apk#Jularr-TV-}"
              candidate_version="${candidate_version%.apk}"
              baseline="v${candidate_version}"

              if git rev-parse --verify -q "refs/tags/${baseline}^{commit}" > /dev/null &&
                git merge-base --is-ancestor "refs/tags/${baseline}^{commit}" HEAD; then
                previous_tv_release="${candidate_release}"
                if git diff --quiet "refs/tags/${baseline}^{commit}" HEAD -- \
                  clients/android/app-tv \
                  clients/android/core-api \
                  clients/android/core-model \
                  clients/android/core-player \
                  clients/android/core-session \
                  clients/android/core-design \
                  clients/android/core-update \
                  clients/android/build.gradle.kts \
                  clients/android/settings.gradle.kts \
                  clients/android/gradle.properties \
                  clients/android/gradle \
                  design/player; then
                  tv_changed=false
                fi
                break
              fi
            done <<< "${release_assets}"
          fi

          echo "TV changed: ${tv_changed}; prior TV assets: ${previous_tv_release:-none}"
          {
            echo "tv_changed=${tv_changed}"
            echo "previous_tv_release=${previous_tv_release}"
            echo "dry_run=${DRY_RUN}"
            echo "tag=${tag}"
            echo "version=${version}"
            echo "minor=${minor}"
            echo "prerelease=${prerelease}"
          } >> "${GITHUB_OUTPUT}"

  image:
    needs: [guard, tv-sign]
    # A changed TV tree must be verified and signed before image publication.
    # Server-only tags reuse the prior signed APK; dry runs publish nothing.
    if: ${{ always() && needs.guard.result == 'success' && (needs.guard.outputs.dry_run == 'true' || needs.guard.outputs.tv_changed == 'false' || needs.tv-sign.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      # linux/amd64 only: the Dockerfile supports arm64, but its SDK and apt steps would run under QEMU emulation.
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        if: needs.guard.outputs.dry_run != 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # A published version is immutable; only latest and the minor tag move.
      - name: Refuse to overwrite a published version
        if: needs.guard.outputs.dry_run != 'true'
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          if docker manifest inspect "${IMAGE}:${VERSION}" > /dev/null 2>&1; then
            echo "::error::${IMAGE}:${VERSION} is already published. Release a new version instead."
            exit 1
          fi
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.guard.outputs.version }}
            type=raw,value=${{ needs.guard.outputs.minor }},enable=${{ needs.guard.outputs.prerelease == 'false' }}
            type=raw,value=latest,enable=${{ needs.guard.outputs.prerelease == 'false' }}
          labels: |
            org.opencontainers.image.version=${{ needs.guard.outputs.version }}
      # Without dry_run this pushes; with it the image is only built.
      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: ${{ needs.guard.outputs.dry_run != 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: JULARR_VERSION=${{ needs.guard.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify the published image
        if: needs.guard.outputs.dry_run != 'true'
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          docker pull "${IMAGE}:${VERSION}"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "${IMAGE}:${VERSION}")" = "${VERSION}"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "${IMAGE}:${VERSION}")" = "${GITHUB_SHA}"

  release:
    needs: [guard, image, tv-sign]
    if: ${{ always() && needs.guard.outputs.dry_run != 'true' && needs.guard.result == 'success' && needs.image.result == 'success' && (needs.guard.outputs.tv_changed == 'false' || needs.tv-sign.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.guard.outputs.tag }}
          VERSION: ${{ needs.guard.outputs.version }}
          PRERELEASE: ${{ needs.guard.outputs.prerelease }}
        run: |
          set -euo pipefail
          # Draft until the matching signed APK and its checksum are uploaded.
          # A published release must never be modified by a retry.
          if gh release view "${TAG}" > /dev/null 2>&1; then
            is_draft="$(gh release view "${TAG}" --json isDraft --jq .isDraft)"
            if [[ "${is_draft}" != "true" ]]; then
              echo "::error::Release ${TAG} is already public; do not overwrite it."
              exit 1
            fi
          else
            args=(--draft)
            [[ "${PRERELEASE}" == "false" ]] || args+=(--prerelease)
            gh release create "${TAG}" --verify-tag --title "Jularr ${VERSION}" --generate-notes "${args[@]}"
          fi
      - name: Download newly signed TV package
        if: needs.guard.outputs.tv_changed == 'true'
        uses: actions/download-artifact@v7
        with:
          name: jularr-tv-release-assets
          path: dist
      - name: Reuse the last signed TV package without rebuilding
        if: needs.guard.outputs.tv_changed == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PREVIOUS_TV_RELEASE: ${{ needs.guard.outputs.previous_tv_release }}
        run: |
          set -euo pipefail
          test -n "${PREVIOUS_TV_RELEASE}"
          mkdir -p dist
          gh release download "${PREVIOUS_TV_RELEASE}" \
            --pattern 'Jularr-TV-*.apk*' --dir dist
      - name: Attach verified Android TV assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.guard.outputs.tag }}
        run: |
          set -euo pipefail
          mapfile -t tv_apks < <(find dist -maxdepth 1 -name 'Jularr-TV-*.apk' -type f)
          test "${#tv_apks[@]}" -eq 1
          test -f "${tv_apks[0]}.sha256"
          (cd dist && sha256sum -c Jularr-TV-*.apk.sha256)
          gh release upload "$TAG" dist/*.apk dist/*.apk.sha256 --clobber
          # Do not expose a stable update to devices until both assets exist.
          gh release edit "$TAG" --draft=false

  # Build and sign the TV package in this same trusted Release run. GitHub does
  # not dispatch a second release event from the automatic GITHUB_TOKEN.
  tv-verify:
    needs: guard
    if: ${{ needs.guard.outputs.dry_run != 'true' && needs.guard.outputs.tv_changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.guard.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify official release tag on main
        env:
          TAG: ${{ needs.guard.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]] || exit 1
          git fetch origin main
          test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: android-actions/setup-android@v4
      - name: Install SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.8.0"
      - name: Validate exact release tree before signing
        working-directory: clients/android
        run: >-
          gradle --parallel --build-cache
          :core-api:testDebugUnitTest
          :core-model:testDebugUnitTest
          :core-player:testDebugUnitTest
          :core-session:testDebugUnitTest
          :core-design:testDebugUnitTest
          :core-update:testDebugUnitTest
          :app-tv:testDebugUnitTest
          :app-tv:lintDebug

  tv-sign:
    needs: [guard, tv-verify]
    if: ${{ needs.guard.outputs.dry_run != 'true' && needs.guard.outputs.tv_changed == 'true' && needs.tv-verify.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.guard.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: android-actions/setup-android@v4
      - name: Install SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.8.0"
      - name: Load protected signing material
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for value in "$KEYSTORE_BASE64" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD"; do
            if [[ -z "$value" ]]; then
              echo "::error::Android TV production signing secrets are incomplete."
              exit 1
            fi
          done
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/jularr-tv-release.jks"
          echo "JULARR_ANDROID_KEYSTORE=$RUNNER_TEMP/jularr-tv-release.jks" >> "$GITHUB_ENV"
          echo "JULARR_ANDROID_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "JULARR_ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "JULARR_ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Build signed Android TV APK
        working-directory: clients/android
        env:
          VERSION: ${{ needs.guard.outputs.tag }}
        run: gradle --build-cache :app-tv:assembleRelease "-PjularrVersion=${VERSION#v}"
      - name: Verify signature and generate portable SHA-256
        shell: bash
        env:
          VERSION: ${{ needs.guard.outputs.tag }}
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          apk="clients/android/app-tv/build/outputs/apk/release/app-tv-release.apk"
          test -s "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"
          mkdir -p dist
          cp "$apk" "dist/Jularr-TV-$version.apk"
          (cd dist && sha256sum "Jularr-TV-$version.apk" > "Jularr-TV-$version.apk.sha256")
          (cd dist && sha256sum -c "Jularr-TV-$version.apk.sha256")
      - name: Store verified signed APK and checksum for the release
        uses: actions/upload-artifact@v7
        with:
          name: jularr-tv-release-assets
          if-no-files-found: error
          path: |
            dist/*.apk
            dist/*.sha256
          retention-days: 1
      - name: Remove signing file
        if: always()
        run: rm -f "$RUNNER_TEMP/jularr-tv-release.jks"
