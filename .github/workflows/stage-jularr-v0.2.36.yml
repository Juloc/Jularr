name: Stage Jularr v0.2.36 (one time)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stage-jularr-v0.2.36.yml'

permissions:
  contents: write
  actions: write

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify release commit, tag and dispatch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TARGET_SHA: 001ccc44e53ffadf4cf78c0c48abdf4958b93cfd
        run: |
          set -euo pipefail
          for workflow in "Frontend" "Backend Full"; do
            outcome="$(gh run list --commit "${TARGET_SHA}" --workflow "${workflow}" --limit 50 \
              --json status,conclusion,createdAt \
              --jq 'map(select(.status == "completed")) | sort_by(.createdAt) | last | .conclusion // empty')"
            if [[ "${outcome}" != "success" ]]; then
              echo "::error::${workflow} not green on ${TARGET_SHA}: ${outcome:-missing}"
              exit 1
            fi
          done
          if gh api "repos/${GH_REPO}/git/ref/tags/v0.2.36" >/dev/null 2>&1; then
            echo "::error::v0.2.36 already exists, refusing overwrite"
            exit 1
          fi
          gh api "repos/${GH_REPO}/git/refs" -X POST \
            -f ref='refs/tags/v0.2.36' -f sha="${TARGET_SHA}"
          # GITHUB_TOKEN-created tags do not start push workflows.
          gh workflow run release.yml --ref v0.2.36 -f dry_run=false
