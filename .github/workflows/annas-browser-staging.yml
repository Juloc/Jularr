name: Anna Browser Linux Container Probe

# Fast, fail-closed smoke check of managed Chrome in an ephemeral Linux container.
# The .NET 10 SDK default image is Ubuntu, NOT Debian. A real Debian VM with
# browser-scoped kernel egress isolation remains a separate release gate.
on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/Jularr.Backend.Tests/SourceBrowserTests.cs'
      - 'src/Jularr.Integrations/Logic/Browser/**'
      - '.github/workflows/annas-browser-staging.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: anna-browser-staging-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  private-egress:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0
    timeout-minutes: 10
    env:
      JULARR_BROWSER_NETWORK_STAGING: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      JULARR_TEST_DB: ''
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Fail fast if Chrome cannot use its namespace sandbox
        shell: bash
        run: |
          set -euo pipefail
          . /etc/os-release
          echo "Container OS: ${PRETTY_NAME}"
          # Check BEFORE apt, npm, Chrome download or .NET build. An unavailable
          # sandbox must fail the security test, never become an inconclusive PASS.
          useradd --create-home --uid 10001 jularr
          if ! command -v unshare >/dev/null 2>&1; then
            echo "::error title=Chrome sandbox unavailable::unshare is missing in the test image."
            exit 1
          fi
          if ! runuser -u jularr -- unshare --user --map-root-user true; then
            echo "::error title=Chrome sandbox unavailable::The test container blocks unprivileged user namespaces. Run browser staging on an isolated host with a supported sandbox policy; do not use --no-sandbox or relax the production container."
            exit 1
          fi
          echo "Unprivileged user namespace: available"
      - name: Install managed-Chrome runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates libasound2t64 libatk-bridge2.0-0 libatk1.0-0 libcups2 \
            libdbus-1-3 libnss3 libnspr4 libgbm1 libdrm2 libglib2.0-0 \
            libx11-6 libxcb1 libxcomposite1 libxdamage1 libxext6 libxfixes3 \
            libxkbcommon0 libxrandr2 libxshmfence1 libpango-1.0-0 \
            libcairo2 libx11-xcb1 libxrender1 libxss1 libxi6 libxtst6 fonts-liberation
          install -d -m 0755 -o jularr -g jularr /tmp/jularr-stage-home /tmp/jularr-stage-results
          rm -rf /var/lib/apt/lists/*
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Compile frontend assets needed by the test project
        working-directory: src/Jularr.Frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Compile isolated backend test project
        run: dotnet build tests/Jularr.Backend.Tests --configuration Release
      - name: Managed Chrome real private-socket test as unprivileged user
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 240s runuser -u jularr -- env \
            HOME=/tmp/jularr-stage-home \
            DOTNET_CLI_HOME=/tmp/jularr-stage-home \
            JULARR_BROWSER_NETWORK_STAGING=1 \
            dotnet test tests/Jularr.Backend.Tests \
              --configuration Release --no-build \
              --filter "FullyQualifiedName~Browser_NetworkStaging_ManagedChromeCannotReachLoopbackSentinel" \
              --logger "trx;LogFileName=anna-browser-staging.trx" \
              --results-directory /tmp/jularr-stage-results
      - name: Preserve focused evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: anna-browser-linux-probe
          path: /tmp/jularr-stage-results/*.trx
          if-no-files-found: ignore
          retention-days: 7

  exited-browser:
    # The generic Backend workflow skips test shards for draft PRs. Execute the
    # one focused local-process test without installing Chrome or using Docker.
    # On ready-for-review PRs the normal Backend workflow runs the same test.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/Jularr.Frontend/package-lock.json
      - name: Compile test assets
        working-directory: src/Jularr.Frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Assert a dead browser fails once and promptly
        run: |
          dotnet test tests/Jularr.Backend.Tests --configuration Release \
            --filter "FullyQualifiedName~Browser_ExitedProcessFailsFastWithoutThreeRetries" \
            --logger "trx;LogFileName=browser-exit.trx" \
            --results-directory TestResults/ci/anna-browser-exit
      - name: Preserve isolated test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: anna-browser-exit
          path: TestResults/ci/anna-browser-exit/*.trx
          if-no-files-found: ignore
          retention-days: 7
