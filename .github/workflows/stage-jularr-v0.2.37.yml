name: Stage Jularr v0.2.37 (one time)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stage-jularr-v0.2.37.yml'

permissions:
  contents: write
  actions: write

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Verify exact commit, create immutable tag and dispatch Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TARGET_SHA: 9dda48b4311e0542523f9120f835e5c5e17f6033
          VERIFY_BRANCH: ci/release-verify-v0.2.37
        run: |
          set -euo pipefail
          has_success() {
            gh run list --commit "${TARGET_SHA}" --workflow "$1" --limit 100 \
              --json status,conclusion \
              --jq 'any(.[]; .status == "completed" and .conclusion == "success")'
          }
          for pair in "Frontend:frontend.yml" "Backend Full:backend.yml"; do
            name="${pair%%:*}"
            if [[ "$(has_success "${name}")" == "true" ]]; then
              echo "${name} has completed successfully on ${TARGET_SHA}"
              continue
            fi
            # If main CI is cancelled by the release-trigger merge, run an
            # independent verification using a branch pinned to the same SHA.
            if ! gh api "repos/${GH_REPO}/git/ref/heads/${VERIFY_BRANCH}" >/dev/null 2>&1; then
              gh api "repos/${GH_REPO}/git/refs" -X POST \
                -f ref="refs/heads/${VERIFY_BRANCH}" -f sha="${TARGET_SHA}"
            fi
            gh workflow run "${pair#*:}" --ref "${VERIFY_BRANCH}"
          done
          verified=false
          for attempt in $(seq 1 240); do
            pending=false
            for pair in "Frontend:frontend.yml" "Backend Full:backend.yml"; do
              name="${pair%%:*}"
              if [[ "$(has_success "${name}")" == "true" ]]; then continue; fi
              file="${pair#*:}"
              state="$(gh run list --workflow "${file}" --branch "${VERIFY_BRANCH}" --limit 20 \
                --json status,conclusion,createdAt \
                --jq 'sort_by(.createdAt) | last | if . == null then "" else (.status + "/" + (.conclusion // "")) end')"
              if [[ "${state}" == "completed/failure" || "${state}" == "completed/cancelled" || "${state}" == "completed/timed_out" ]]; then
                echo "::error::${name} independent verification failed: ${state}"
                exit 1
              fi
              pending=true
            done
            if [[ "${pending}" == "false" ]]; then verified=true; break; fi
            sleep 10
          done
          if [[ "${verified}" != "true" ]]; then
            echo "::error::CI did not verify both workflows in time"
            exit 1
          fi
          for name in "Frontend" "Backend Full"; do
            if [[ "$(has_success "${name}")" != "true" ]]; then
              echo "::error::${name} not green for ${TARGET_SHA}"
              exit 1
            fi
          done
          if gh api "repos/${GH_REPO}/git/ref/tags/v0.2.37" >/dev/null 2>&1; then
            echo "::error::Tag v0.2.37 already exists; refusing to overwrite"
            exit 1
          fi
          gh api "repos/${GH_REPO}/git/refs" -X POST \
            -f ref='refs/tags/v0.2.37' -f sha="${TARGET_SHA}"
          # A tag created by GITHUB_TOKEN does not trigger tag-push workflows.
          gh workflow run release.yml --ref v0.2.37 -f dry_run=false
