name: Stage Jularr v0.2.33 (one time)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stage-jularr-v0.2.33.yml'

permissions:
  contents: write
  actions: write

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify tested commit, create tag and start Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TARGET_SHA: 3f8ea575952861cb693f8f19a44bf570657d4156
        run: |
          set -euo pipefail
          # All checks must be green for this exact commit. Never skip release gates.
          for workflow in "Frontend" "Backend Full"; do
            conclusion="$(gh run list --commit "${TARGET_SHA}" --workflow "${workflow}" --limit 50 --json status,conclusion,createdAt \
              --jq 'map(select(.status == "completed")) | sort_by(.createdAt) | last | .conclusion // empty')"
            if [[ "${conclusion}" != "success" ]]; then
              echo "::error::${workflow} on ${TARGET_SHA} is not green (result: ${conclusion:-missing})"
              exit 1
            fi
          done
          if gh api "repos/${GH_REPO}/git/ref/tags/v0.2.33" >/dev/null 2>&1; then
            echo "::error::v0.2.33 already exists; refusing to overwrite"
            exit 1
          fi
          gh api "repos/${GH_REPO}/git/refs" -X POST \
            -f ref='refs/tags/v0.2.33' \
            -f sha="${TARGET_SHA}"
          # GITHUB_TOKEN-created tags do not trigger push workflows.
          gh workflow run release.yml --ref v0.2.33 -f dry_run=false
