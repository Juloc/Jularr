name: Backend Full

# Full regression after merges or manual runs. Opt-in PRs call this reusable
# workflow through Backend, without a separate skipped PR run.
#
# Job graph:
#   build  ->  smoke (startup, schema, migrations, sessions, setup gate)  ->  gate
#          ->  shards (6 backend x 2 lanes + 6 browser, each to its end)  ->
# `build` compiles everything once, runs the frontend unit tests, plans the shards and publishes the
# build; smoke and the shards only unpack it and run beside each other. The backend shards leave out
# what smoke runs. No job is meant to run longer than about 10 minutes.
# CI retry (ci-retry.yml) re-runs a run once that failed only in set-up steps; their names are listed in
# scripts/ci-classify-failure.py: rename or add set-up steps there too.
on:
  push:
    branches: [main]
    # A docs-only commit runs nothing here; a release of one needs a manual run (docs/DEVELOPMENT.md, Release).
    paths-ignore:
      - 'docs/**'
      - 'AGENTS.md'
      - 'README.md'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# Newer commits supersede older runs of the same branch or PR (a failing or obsolete run
# stops using runners). A manual release verification run is never cancelled by this workflow.
concurrency:
  group: backend-full-${{ github.event_name == 'workflow_dispatch' && github.run_id || (github.event.pull_request.number || github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  JULARR_TEST_DB: Host=127.0.0.1;Port=15433;Username=jularr_test;Password=isolated-test-password;Database=jularr_test_admin
  # Every dotnet test process: a test still running after 5 minutes is dumped and killed, a crashed test host
  # leaves a dump, and Sequence_*.xml names the test that ran (uploaded on failure as blame-*).
  DOTNET_TEST_BLAME: --blame-hang-timeout 5m --blame-hang-dump-type mini --blame-crash --blame-crash-dump-type mini

jobs:
  # The only compile of the run, the frontend unit tests and the shard plans (ci-plan/*.json, shipped in
  # the build): seconds per test from the last 3 finished Backend Full runs on main, else tests/ci-durations.json.
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
      actions: read  # the timings artifacts of the last finished Backend Full runs on main
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.403
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: src/Jularr.Frontend/package-lock.json
      - name: Verify the CI scripts (test shards and selection)
        run: |
          python3 scripts/ci-shard-tests.py --self-test
          python3 scripts/ci-select-backend-tests.py --self-test
          python3 scripts/ci-classify-failure.py --self-test
      # Never fails: without a token, run or artifact the plan uses tests/ci-durations.json (the log says which).
      - name: Fetch the measured test durations of recent main runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: python3 scripts/ci-shard-tests.py fetch --repo "${REPOSITORY}" --out "${RUNNER_TEMP}/measured"
      - name: Compile assets for the Razor and browser tests
        working-directory: src/Jularr.Frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Frontend unit tests
        working-directory: src/Jularr.Frontend
        run: npm test
      - name: Compile the backend and browser test projects once
        run: |
          dotnet build tests/Jularr.Backend.Tests --configuration Release
          dotnet build tests/Jularr.E2E.Tests --configuration Release
      # The shard counts here equal the matrix entries of `shards`; the real-tool tests run on backend 6/6.
      - name: Plan the test shards
        run: |
          set -euo pipefail
          python3 scripts/ci-shard-tests.py matrix --kind backend --shards 6 --lanes 2 --reserve 6=150 \
            --exclude "$(python3 scripts/ci-select-backend-tests.py --boot-units)" \
            --measured "${RUNNER_TEMP}/measured" --out ci-plan/backend.json
          python3 scripts/ci-shard-tests.py matrix --kind e2e --shards 6 --lanes 1 \
            --measured "${RUNNER_TEMP}/measured" --out ci-plan/e2e.json
      - uses: ./.github/actions/pack-build

  # The quick critical checks, beside the shards: startup, schema, migrations, sessions and the first-owner
  # setup gate (ci-select-backend-tests.py --boot-filter). The backend shards leave these tests out.
  smoke:
    name: smoke
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: jularr_test
          POSTGRES_PASSWORD: isolated-test-password
          POSTGRES_DB: jularr_test_admin
        ports:
          - 15433:5432
        options: >-
          --health-cmd "pg_isready -U jularr_test -d jularr_test_admin"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 60
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/actions
          persist-credentials: false
      - uses: ./.github/actions/restore-build
      # The migration tests run the real pg_dump/pg_restore; the runner's own client is older than the test database.
      - uses: ./.github/actions/install-tools
      - name: Critical backend tests (startup, schema, migrations, sessions, setup gate)
        run: |
          export TMPDIR="${RUNNER_TEMP}"
          dotnet test tests/Jularr.Backend.Tests --configuration Release --no-build ${DOTNET_TEST_BLAME} \
            --filter "$(python3 scripts/ci-select-backend-tests.py --boot-filter)" \
            --logger "trx;LogFileName=backend-smoke.trx" --results-directory TestResults/ci/smoke
      # Seconds per test method: the next runs plan with these too (ci-shard-tests.py fetch).
      - name: Keep smoke test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-results
          path: TestResults/ci/smoke/*.trx
          if-no-files-found: ignore
          retention-days: 7
      - name: Keep the hang and crash evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: blame-smoke
          path: |
            TestResults/ci/**/Sequence_*.xml
            TestResults/ci/**/*.dmp
            !TestResults/ci/**/In/**
          if-no-files-found: ignore
          retention-days: 2

  # The shards of the plan in ci-plan/*.json (scripts/ci-shard-tests.py): balanced by measured seconds per
  # test, a long class split by method. A failing shard does not cancel the others (fail-fast off), so one
  # run reports every failing shard. Backend shards run two test processes (lanes) each; browser shards run one.
  # Change a shard count in the matrix entries of that kind (1/N .. N/N) and in `Plan the test shards` together.
  shards:
    name: ${{ matrix.kind }} (${{ matrix.shard }})
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        include:
          - { kind: backend, shard: 1/6 }
          - { kind: backend, shard: 2/6 }
          - { kind: backend, shard: 3/6 }
          - { kind: backend, shard: 4/6 }
          - { kind: backend, shard: 5/6 }
          # Also runs the real-tool tests (FFmpeg, cjxl): shard 6 is planned 150 lane-seconds lighter.
          - { kind: backend, shard: 6/6, tools: true }
          - { kind: e2e, shard: 1/6 }
          - { kind: e2e, shard: 2/6 }
          - { kind: e2e, shard: 3/6 }
          - { kind: e2e, shard: 4/6 }
          - { kind: e2e, shard: 5/6 }
          - { kind: e2e, shard: 6/6 }
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: jularr_test
          POSTGRES_PASSWORD: isolated-test-password
          POSTGRES_DB: jularr_test_admin
        ports:
          - 15433:5432
        options: >-
          --health-cmd "pg_isready -U jularr_test -d jularr_test_admin"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 60
    env:
      SHARD: ${{ matrix.shard }}
    steps:
      # Only the local actions are checked out; the build artifact brings the compiled workspace.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/actions
          persist-credentials: false
      - uses: ./.github/actions/restore-build
      - uses: ./.github/actions/install-tools
        with:
          ffmpeg: ${{ matrix.kind == 'e2e' || matrix.tools == true }}
          cjxl: ${{ matrix.tools == true }}
          djvulibre: 'true'
      # A concurrent dotnet CLI lane can fail its NuGet-Migrations named mutex
      # when a hosted runner has no /run/user/<uid>/.dotnet/shm directory.
      # Give backend lanes a stable user-owned runtime path before launching them.
      - name: Prepare .NET runtime mutex directory
        if: matrix.kind == 'backend'
        run: |
          mkdir -p "$RUNNER_TEMP/dotnet-runtime/.dotnet/shm"
          chmod 700 "$RUNNER_TEMP/dotnet-runtime"
          echo "XDG_RUNTIME_DIR=$RUNNER_TEMP/dotnet-runtime" >> "$GITHUB_ENV"
          # Downloads reject tmpfs and overlay: use the real runner disk for test workspaces.
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Cache the Playwright browser
        if: matrix.kind == 'e2e'
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/Jularr.E2E.Tests/Jularr.E2E.Tests.csproj') }}
      - name: Install Chromium
        if: matrix.kind == 'e2e'
        uses: ./.github/actions/install-chromium

      # The assembly disables in-process parallelism; lanes are separate dotnet test processes with
      # their own fixture state and databases. The TRX files (timings-*) plan the next runs.
      - name: Run the backend shard
        if: matrix.kind == 'backend'
        shell: bash
        run: |
          set -uo pipefail
          # Parallel dotnet test launches share one ready runtime directory. Without
          # initialization the NuGet-Migrations mutex can race in /run/user/.../shm.
          export XDG_RUNTIME_DIR="${RUNNER_TEMP}/jularr-dotnet-runtime"
          install -d -m 0700 "${XDG_RUNTIME_DIR}" "${XDG_RUNTIME_DIR}/.dotnet" "${XDG_RUNTIME_DIR}/.dotnet/shm"
          dotnet --info >/dev/null
          python3 scripts/ci-shard-tests.py lanes --plan ci-plan/backend.json --shard "${SHARD}" > "${RUNNER_TEMP}/lanes.txt" || exit 1
          mapfile -t lanes < "${RUNNER_TEMP}/lanes.txt"
          pids=()
          for index in "${!lanes[@]}"; do
            [[ -n "${lanes[$index]}" ]] || continue
            lane=$((index + 1))
            (set -o pipefail
             dotnet test tests/Jularr.Backend.Tests --configuration Release --no-build ${DOTNET_TEST_BLAME} \
               --filter "${lanes[$index]}" --logger "trx;LogFileName=backend-lane${lane}.trx" \
               --results-directory TestResults/ci/backend 2>&1 | sed -u "s/^/[lane${lane}] /") &
            pids+=($!)
          done
          failed=0
          for pid in "${pids[@]}"; do wait "${pid}" || failed=1; done
          if [[ "${failed}" -ne 0 ]]; then
            echo "::error::Backend shard ${SHARD}: a test lane failed (lines are prefixed [lane1] / [lane2])."
            exit 1
          fi
        env:
          JULARR_TEST_DJVULIBRE: /usr/bin
      - name: Real-tool tests (FFmpeg HLS, JPEG XL covers)
        if: matrix.kind == 'backend' && matrix.tools == true
        run: |
          cjxl --version
          dotnet test tests/Jularr.Backend.Tests --configuration Release --no-build ${DOTNET_TEST_BLAME} \
            --filter "FullyQualifiedName~JxlEncoder_WithCjxl|FullyQualifiedName~Cover_WithFfmpegAndCjxl|FullyQualifiedName~Inputs_DirectShare_RealFfmpegTranscodesAndSeeksHls" \
            --logger "trx;LogFileName=real-tools.trx" --results-directory TestResults/ci/tools
        env:
          JULARR_TEST_FFMPEG: /usr/bin/ffmpeg
          JULARR_TEST_CJXL: /usr/bin/cjxl
      - name: Run the browser shard
        if: matrix.kind == 'e2e'
        run: |
          # Native download storage refuses RAM and overlay filesystems, so the test folders must lie on the runner's
          # disk. Some runner images mount /tmp as tmpfs: use the runner's temp directory and log where it lies.
          set -euo pipefail
          export TMPDIR="${RUNNER_TEMP}"
          findmnt -T "${TMPDIR}" -o TARGET,FSTYPE,SOURCE || true
          filter="$(python3 scripts/ci-shard-tests.py lanes --plan ci-plan/e2e.json --shard "${SHARD}")"
          # An empty filter would run every browser test.
          if [[ -z "${filter}" ]]; then echo "::notice::Browser shard ${SHARD} has no planned tests."; exit 0; fi
          dotnet test tests/Jularr.E2E.Tests --configuration Release --no-build ${DOTNET_TEST_BLAME} \
            --filter "${filter}" --logger "trx;LogFileName=e2e-shard.trx" --results-directory TestResults/ci/e2e
        env:
          JULARR_TEST_FFMPEG: /usr/bin/ffmpeg
          JULARR_TEST_DJVULIBRE: /usr/bin

      - name: Summarize slowest tests
        if: always()
        run: python3 scripts/ci-test-timings.py TestResults/ci/${{ matrix.kind }}
      - name: Keep timing report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: timings-${{ matrix.kind }}-${{ strategy.job-index }}
          path: TestResults/ci/${{ matrix.kind }}/*.trx
          if-no-files-found: ignore
          retention-days: 7
      - name: Keep the evidence of a failed browser run
        if: failure() && matrix.kind == 'e2e'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-evidence-${{ strategy.job-index }}
          path: TestResults/e2e
          if-no-files-found: ignore
          retention-days: 7
      - name: Keep the hang and crash evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: blame-${{ matrix.kind }}-${{ strategy.job-index }}
          path: |
            TestResults/ci/**/Sequence_*.xml
            TestResults/ci/**/*.dmp
            !TestResults/ci/**/In/**
          if-no-files-found: ignore
          retention-days: 2

  # One clear conclusion for the whole run (and for branch protection, if ever required):
  # green only when the build, smoke and every shard passed. Skipped entirely when the run was not requested.
  gate:
    name: gate
    needs: [build, smoke, shards]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require the build, smoke and all shards
        env:
          BUILD: ${{ needs.build.result }}
          SMOKE: ${{ needs.smoke.result }}
          SHARDS: ${{ needs.shards.result }}
        run: |
          echo "build: ${BUILD}, smoke: ${SMOKE}, shards: ${SHARDS}"
          if [[ "${BUILD}" != "success" || "${SMOKE}" != "success" || "${SHARDS}" != "success" ]]; then
            echo "::error::Backend Full did not pass (build ${BUILD}, smoke ${SMOKE}, shards ${SHARDS}). Open the failed job: build, smoke, or a shard named backend or e2e with its number."
            exit 1
          fi
