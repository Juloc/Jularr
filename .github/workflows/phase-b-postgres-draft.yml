# Runs ONLY the Phase-B draft DDL in an isolated disposable PostgreSQL service.
# Never connects to dev/production databases, mounts NAS files or uses repository secrets.
name: Phase B PostgreSQL draft validation

on:
  pull_request:
    paths:
      - "docs/DATABASE_CUTOVER_PHASE_B_*.sql"
      - ".github/workflows/phase-b-postgres-draft.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-target-drafts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: phase_b_ci
          POSTGRES_PASSWORD: phase_b_ci_only
          POSTGRES_DB: phase_b_scratch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U phase_b_ci -d phase_b_scratch"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: phase_b_ci
      PGPASSWORD: phase_b_ci_only
      PGDATABASE: phase_b_scratch
    steps:
      - name: Checkout exactly this draft branch
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Bootstrap all Phase B DDL drafts on EMPTY isolated database
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for id in $(seq -w 1 15); do
            files=(docs/DATABASE_CUTOVER_PHASE_B_${id}_*_DRAFT.sql)
            if [ "${#files[@]}" -ne 1 ]; then
              printf 'Expected one DDL draft for phase %s; found %s\n' "$id" "${#files[@]}" >&2
              exit 1
            fi
            echo "::group::Run ${files[0]} on disposable PostgreSQL"
            psql -X -v ON_ERROR_STOP=1 -f "${files[0]}"
            echo "::endgroup::"
          done

      - name: Verify catalog invariants in read-only transaction
        run: |
          psql -X -v ON_ERROR_STOP=1 -f docs/DATABASE_CUTOVER_PHASE_B_PG_ASSERTIONS_DRAFT.sql

      - name: Exercise positive and expected-negative relational integrity cases
        run: |
          psql -X -v ON_ERROR_STOP=1 -f docs/DATABASE_CUTOVER_PHASE_B_PG_NEGATIVE_TESTS.sql

      - name: Test event audience isolation and delivery attempts
        run: |
          psql -X -v ON_ERROR_STOP=1 -f docs/DATABASE_CUTOVER_PHASE_B_PG_EVENTS_TESTS.sql

      - name: Prepare canonical static Watchlist WorkCard SELECT
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const source = fs.readFileSync('docs/DATABASE_CUTOVER_PHASE_B_READ_QUERIES_DRAFT.sql', 'utf8');
          const start = source.indexOf('WITH "PageRoots" AS MATERIALIZED');
          const end = source.indexOf('-- 2. Bounded Continue list');
          if (start < 0 || end <= start) throw Error('Watchlist SELECT not found');
          let sql = source.slice(start, end).trim().replace(/;$/, '');
          for (const [name, value] of Object.entries({
            '@ActiveProfileId': '$1',
            '@UiLocale': '$2',
            '@PageSize': '$3',
            '@Offset': '$4'
          })) sql = sql.replaceAll(name, value);
          if (sql.includes('@')) throw Error('Unbound placeholder in canonical SELECT');
          fs.writeFileSync('/tmp/phase_b_watchlist_prepared.sql',
            'PREPARE phase_b_watchlist(bigint,text,integer,integer) AS\n' + sql + ';\n');
          NODE

      - name: Execute WorkCard SELECT against 1000 scratch root rows
        run: |
          psql -X -v ON_ERROR_STOP=1 -f docs/DATABASE_CUTOVER_PHASE_B_PG_WORKCARD_QUERY_TESTS.sql

      - name: Prepare exact canonical Continue and Operations claim SQL
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const source = fs.readFileSync('docs/DATABASE_CUTOVER_PHASE_B_READ_QUERIES_DRAFT.sql', 'utf8');
          const section2 = source.indexOf('-- 2. Bounded Continue list');
          const section3 = source.indexOf('-- 3. Logic-only short transaction');
          const section4 = source.indexOf('-- 4. Logic-only bounded optimistic checkpoint');
          if (section4 <= section3) throw Error('Progress CAS section missing');
          if (section2 < 0 || section3 <= section2) throw Error('Missing canonical queries');
          function compile(sql, bindings) {
            let result = sql.trim().replace(/;$/, '');
            for (const [key,value] of Object.entries(bindings)) result = result.replaceAll(key,value);
            if (result.includes('@')) throw Error('Unbound SQL placeholder in service/logic SQL');
            return result;
          }
          const continueSql = compile(
            source.slice(source.indexOf('SELECT',section2),section3),
            { '@ActiveProfileId':'$1', '@PageSize':'$2', '@Offset':'$3' });
          const claimSql = compile(
            source.slice(source.indexOf('WITH claimed AS',section3),section4),
            { '@PendingStatusTypeId':'$1', '@RunningStatusTypeId':'$2',
              '@BatchSize':'$3', '@TrustedWorkerKey':'$4' });
          fs.writeFileSync('/tmp/phase_b_continue_prepared.sql',
            'PREPARE phase_b_continue(bigint,integer,integer) AS\n' + continueSql + ';\n');
          fs.writeFileSync('/tmp/phase_b_claim_prepared.sql',
            'PREPARE phase_b_claim(smallint,smallint,integer,text) AS\n' + claimSql + ';\n');
          const casSql = compile(
            source.slice(source.indexOf('UPDATE "MediaProgress" AS progress',section4)),
            { '@MediaProgressId':'$1', '@ActiveProfileId':'$2', '@ExpectedRevision':'$3' });
          fs.writeFileSync('/tmp/phase_b_progress_cas_prepared.sql',
            'PREPARE phase_b_progress_cas(bigint,bigint,bigint) AS\n' + casSql + ';\n');
          NODE

      - name: Execute profile-scoped Continue and verify pagination on scratch database
        run: |
          psql -X -v ON_ERROR_STOP=1 -f docs/DATABASE_CUTOVER_PHASE_B_PG_CONTINUE_QUERY_TESTS.sql

      - name: Verify multi-target Wanted acquisition integrity
        run: |
          psql -X -v ON_ERROR_STOP=1 -f docs/DATABASE_CUTOVER_PHASE_B_PG_ACQUISITION_COVERAGE_TESTS.sql

      - name: Verify scoped optimistic offline progress checkpoint and replay
        run: |
          psql -X -v ON_ERROR_STOP=1 -f docs/DATABASE_CUTOVER_PHASE_B_PG_PROGRESS_CAS_TESTS.sql

      - name: Verify independent workers SKIP LOCKED and retry eligibility
        run: |
          bash docs/DATABASE_CUTOVER_PHASE_B_PG_CLAIM_CONCURRENCY_TEST.sh

      - name: Verify Learning profile/media/work/content scope invariants
        run: |
          psql -X -v ON_ERROR_STOP=1 -f docs/DATABASE_CUTOVER_PHASE_B_PG_LEARNING_SCOPE_TESTS.sql

      - name: Verify distinct public resource identity and internal FKs
        run: |
          psql -X -v ON_ERROR_STOP=1 -f docs/DATABASE_CUTOVER_PHASE_B_PG_PUBLIC_IDS_TESTS.sql

      - name: Verify one AI provider and profile-owned settings/usage lifecycle
        run: |
          psql -X -v ON_ERROR_STOP=1 -f docs/DATABASE_CUTOVER_PHASE_B_PG_AI_TESTS.sql

      - name: Check the target table count and schema isolation
        shell: bash
        run: |
          set -euo pipefail
          count="$(psql -X -A -t -v ON_ERROR_STOP=1 -c \
            "SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE c.relkind='r' AND n.nspname='public' AND c.relname NOT LIKE 'pg_%'")"
          echo "Target draft tables: $count"
          if [ "$count" -ne 179 ]; then
            echo "Expected 179 proposed Phase B tables; unexpected DDL drift" >&2
            exit 1
          fi
