name: Browser Package Digest
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/browser-package-digest.yml']
permissions:
  contents: read
jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify pinned Chrome for Testing distribution
        shell: bash
        run: |
          set -euo pipefail
          for spec in "linux64 chrome-linux64" "linux-arm64 chrome-linux-arm64"; do
            set -- $spec
            url="https://storage.googleapis.com/chrome-for-testing-public/156.0.8078.47/$1/$2.zip"
            curl --fail --location --retry 2 --max-time 200 "$url" -o chrome.zip
            printf 'CHROME_PACKAGE_SHA256 %s ' "$1"
            sha256sum chrome.zip
            rm chrome.zip
          done
