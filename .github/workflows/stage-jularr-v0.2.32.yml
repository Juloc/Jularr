name: Stage Jularr v0.2.32 (one time)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stage-jularr-v0.2.32.yml'

permissions:
  contents: write
  actions: write

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create immutable release tag and dispatch Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TARGET_SHA: 296b494504bb4e827895fae79c4c83a66217f74a
        run: |
          set -euo pipefail
          if gh api "repos/${GH_REPO}/git/ref/tags/v0.2.32" >/dev/null 2>&1; then
            echo "::error::v0.2.32 already exists; refusing to overwrite"
            exit 1
          fi
          gh api "repos/${GH_REPO}/git/refs" -X POST \
            -f ref='refs/tags/v0.2.32' \
            -f sha="${TARGET_SHA}"
          # GITHUB_TOKEN-created tags do not start push workflows; dispatch explicitly.
          gh workflow run release.yml --ref v0.2.32 -f dry_run=false
