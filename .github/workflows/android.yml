name: Android

on:
  workflow_call:
    inputs:
      release:
        description: "Build signed APKs for the current Jularr release"
        required: false
        default: false
        type: boolean
    # Declared explicitly so the caller passes exactly the signing material and nothing else.
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: true
      ANDROID_KEYSTORE_PASSWORD:
        required: true
      ANDROID_KEY_ALIAS:
        required: true
      ANDROID_KEY_PASSWORD:
        required: true
  workflow_dispatch:

  pull_request:
    paths:
      - "clients/android/**"
      - "design/player/**"
      - ".github/workflows/android.yml"
  push:
    branches:
      - "dev"
    paths:
      - "clients/android/**"
      - "design/player/**"
      - ".github/workflows/android.yml"
permissions:
  contents: read

# A release signing run reached through workflow_call must never be cancelled by a newer run.
concurrency:
  group: android-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ inputs.release != true }}

jobs:
  # Runs for every trigger, including the release call, so signed assets only exist for a tree
  # that passed the Android unit tests and lint. Manual dispatch on any ref ends here (unsigned).
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.8.0"

      - name: Test and lint Android
        working-directory: clients/android
        run: >-
          gradle --stacktrace --parallel --build-cache
          :core-api:testDebugUnitTest
          :core-player:testDebugUnitTest
          :core-tts:testDebugUnitTest
          :core-update:testDebugUnitTest
          :app-mobile:testDebugUnitTest
          :app-tv:testDebugUnitTest
          :app-mobile:lintDebug
          :app-tv:lintDebug
          :core-api:lintDebug
          :core-model:lintDebug
          :core-player:lintDebug
          :core-session:lintDebug
          :core-design:lintDebug
          :core-tts:lintDebug
          :core-update:lintDebug

  # Production signing is reachable only through the CI release call on main. The signed assets
  # are uploaded as an artifact; the CI release flow attaches them to the GitHub Release.
  release:
    if: inputs.release == true && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.8.0"

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("src/Jularr.Web/Jularr.Web.csproj").getroot()
          version = root.findtext(".//Version")
          if not version:
              raise SystemExit("Jularr.Web.csproj has no Version.")
          print(version.strip())
          PY
          )"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Stamp Android package version
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          VERSION_CODE="${GITHUB_RUN_NUMBER}"
          for file in             clients/android/app-mobile/build.gradle.kts             clients/android/app-tv/build.gradle.kts
          do
            sed -i -E "s/versionCode = [0-9]+/versionCode = ${VERSION_CODE}/" "${file}"
            sed -i -E "s/versionName = \"[^\"]+\"/versionName = \"${VERSION}\"/" "${file}"
          done

      - name: Build release APKs
        working-directory: clients/android
        run: >-
          gradle --stacktrace --parallel --build-cache
          :app-mobile:assembleRelease
          :app-tv:assembleRelease

      - name: Sign APKs and generate checksums
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          : "${ANDROID_KEYSTORE_BASE64:?ANDROID_KEYSTORE_BASE64 is required}"
          : "${ANDROID_KEYSTORE_PASSWORD:?ANDROID_KEYSTORE_PASSWORD is required}"
          : "${ANDROID_KEY_ALIAS:?ANDROID_KEY_ALIAS is required}"
          : "${ANDROID_KEY_PASSWORD:?ANDROID_KEY_PASSWORD is required}"

          KEYSTORE="${RUNNER_TEMP}/jularr-release.jks"
          trap 'rm -f "${KEYSTORE}"' EXIT
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${KEYSTORE}"

          MOBILE_UNSIGNED="$(find clients/android/app-mobile/build/outputs/apk/release -name '*-release-unsigned.apk' -print -quit)"
          TV_UNSIGNED="$(find clients/android/app-tv/build/outputs/apk/release -name '*-release-unsigned.apk' -print -quit)"
          test -n "${MOBILE_UNSIGNED}"
          test -n "${TV_UNSIGNED}"

          mkdir -p dist
          ZIPALIGN="${ANDROID_HOME}/build-tools/36.0.0/zipalign"
          APKSIGNER="${ANDROID_HOME}/build-tools/36.0.0/apksigner"

          sign_apk() {
            local source="$1"
            local name="$2"
            local aligned="${RUNNER_TEMP}/${name}-aligned.apk"
            local target="dist/${name}.apk"

            "${ZIPALIGN}" -f -p 4 "${source}" "${aligned}"
            "${APKSIGNER}" sign               --ks "${KEYSTORE}"               --ks-key-alias "${ANDROID_KEY_ALIAS}"               --ks-pass env:ANDROID_KEYSTORE_PASSWORD               --key-pass env:ANDROID_KEY_PASSWORD               --out "${target}"               "${aligned}"
            "${APKSIGNER}" verify --verbose "${target}"
            # Checksum from inside dist so the file names the portable basename and
            # "sha256sum -c" works next to the downloaded APK.
            (cd dist && sha256sum "${name}.apk" > "${name}.apk.sha256")
          }

          sign_apk "${MOBILE_UNSIGNED}" "Jularr-Mobile-${VERSION}"
          sign_apk "${TV_UNSIGNED}" "Jularr-TV-${VERSION}"

      - name: Upload signed release assets
        uses: actions/upload-artifact@v7
        with:
          name: jularr-android-release-assets
          if-no-files-found: error
          path: |
            dist/*.apk
            dist/*.sha256
          retention-days: 1
