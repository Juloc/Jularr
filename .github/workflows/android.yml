name: Android

on:
  workflow_dispatch:

  pull_request:
    paths:
      - "clients/android/app-tv/**"
      - "clients/android/core-api/**"
      - "clients/android/core-model/**"
      - "clients/android/core-player/**"
      - "clients/android/core-session/**"
      - "clients/android/core-design/**"
      - "clients/android/core-update/**"
      - "clients/android/build.gradle.kts"
      - "clients/android/settings.gradle.kts"
      - "clients/android/gradle.properties"
      - "clients/android/gradle/**"
      - "design/player/**"
      - ".github/workflows/android.yml"
  push:
    branches:
      - "dev"
    paths:
      - "clients/android/app-tv/**"
      - "clients/android/core-api/**"
      - "clients/android/core-model/**"
      - "clients/android/core-player/**"
      - "clients/android/core-session/**"
      - "clients/android/core-design/**"
      - "clients/android/core-update/**"
      - "clients/android/build.gradle.kts"
      - "clients/android/settings.gradle.kts"
      - "clients/android/gradle.properties"
      - "clients/android/gradle/**"
      - "design/player/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

concurrency:
  group: android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # TV app and only the Android modules it actually uses. Mobile-only changes
  # are tested in android-mobile.yml, without starting the TV build.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.8.0"

      - name: Test and lint Android
        working-directory: clients/android
        run: >-
          gradle --stacktrace --parallel --build-cache
          :core-api:testDebugUnitTest
          :core-model:testDebugUnitTest
          :core-player:testDebugUnitTest
          :core-session:testDebugUnitTest
          :core-design:testDebugUnitTest
          :core-update:testDebugUnitTest
          :app-tv:testDebugUnitTest
          :app-tv:lintDebug
          :core-api:lintDebug
          :core-model:lintDebug
          :core-player:lintDebug
          :core-session:lintDebug
          :core-design:lintDebug
          :core-update:lintDebug

      - name: Compile unsigned TV release variant
        working-directory: clients/android
        run: gradle --build-cache :app-tv:assembleRelease -PjularrVersion=0.2.0
      # A debug-signed preview may be sideloaded for physical TV smoke tests
      # before a stable release. Its signing cert is NOT the protected release
      # cert: uninstall a preview before installing an official Jularr-TV APK.
      - name: Assemble installable TV preview
        working-directory: clients/android
        run: gradle --build-cache :app-tv:assembleDebug

      - name: Upload installable TV preview APK
        uses: actions/upload-artifact@v7
        with:
          name: jularr-tv-preview-debug
          path: clients/android/app-tv/build/outputs/apk/debug/app-tv-debug.apk
          if-no-files-found: error
          retention-days: 7

