name: Backend

# Always report a stable PR check; docs-only changes skip the costly job.
# Affected projects compile, then exercise real PostgreSQL and API smoke tests.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.paths.outputs.backend }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect affected project files
        id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          if grep -Eq '^(src/|tests/|database/|scripts/|[^/]+[.]sln$|NuGet[.]Config$|[.]github/workflows/backend(-pr)?[.]yml$)|[.](props|targets)$' <<< "$files"; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: jularr_test
          POSTGRES_PASSWORD: isolated-test-password
          POSTGRES_DB: jularr_test_admin
        ports:
          - 15433:5432
        options: >-
          --health-cmd "pg_isready -U jularr_test -d jularr_test_admin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      JULARR_TEST_DB: Host=127.0.0.1;Port=15433;Username=jularr_test;Password=isolated-test-password;Database=jularr_test_admin
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/Jularr.Frontend/package-lock.json
      - name: Compile assets required by Razor tests
        working-directory: src/Jularr.Frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Compile the backend test project and its dependencies
        run: dotnet build tests/Jularr.Backend.Tests --configuration Release
      - name: Verify change-aware test selection
        run: python3 scripts/ci-select-backend-tests.py --self-test
      - name: Smoke and focused tests for changed backend areas
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          FILTER="$(python3 scripts/ci-select-backend-tests.py "$BASE_SHA" "$HEAD_SHA")"
          dotnet test tests/Jularr.Backend.Tests --configuration Release --no-build \
            --filter "$FILTER" \
            --logger "trx;LogFileName=backend-pr.trx" \
            --results-directory TestResults/ci/fast
      - name: Keep smoke test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-pr-smoke
          path: TestResults/ci/fast/*.trx
          if-no-files-found: ignore
          retention-days: 7
