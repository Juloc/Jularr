name: Backend

# Always report a stable PR check (`Backend / test`); docs-only changes skip the costly jobs.
# Job graph: prepare (build once, smoke methods, change-aware selection, shard plan) -> shards (the
# selected tests in 1 to 6 balanced shards of two lanes, as many as their measured time needs)
# -> test (the one required conclusion).
# CI retry (ci-retry.yml) re-runs a run once that failed only in set-up steps; their names are listed in
# scripts/ci-classify-failure.py: rename or add set-up steps there too.
# A PR with the label ci/full runs the full regression instead of the selection. Labels and edits of title or
# description start nothing here: adding ci/full starts the full regression in backend-full-label.yml.
on:
  pull_request:
    branches: [main, dev]
    types: [opened, synchronize, reopened, converted_to_draft, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  JULARR_TEST_DB: Host=127.0.0.1;Port=15433;Username=jularr_test;Password=isolated-test-password;Database=jularr_test_admin
  # Every dotnet test process: a test still running after 5 minutes is dumped and killed, a crashed test host
  # leaves a dump, and Sequence_*.xml names the test that ran (uploaded on failure as blame-*).
  DOTNET_TEST_BLAME: --blame-hang-timeout 5m --blame-hang-dump-type mini --blame-crash --blame-crash-dump-type mini

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
      actions: read  # the timings artifacts of the last finished Backend Full runs on main
    outputs:
      backend: ${{ steps.paths.outputs.backend }}
      classes: ${{ steps.select.outputs.classes }}
      matrix: ${{ steps.plan.outputs.matrix }}
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: jularr_test
          POSTGRES_PASSWORD: isolated-test-password
          POSTGRES_DB: jularr_test_admin
        ports:
          - 15433:5432
        options: >-
          --health-cmd "pg_isready -U jularr_test -d jularr_test_admin"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Only the two compared commits, without history: git diff compares their trees.
      - name: Fetch the base and head commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git fetch --no-tags --quiet --depth=1 origin "$BASE_SHA" "$HEAD_SHA"
      - name: Detect affected project files
        id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DRAFT: ${{ github.event.pull_request.draft }}
          FULL: ${{ contains(github.event.pull_request.labels.*.name, 'ci/full') }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$DRAFT" == "true" || "$FULL" == "true" ]]; then
            echo "backend=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          backend_files="$(printf '%s\n' "$files" | grep -Ev '^(src/Jularr.Frontend/|tests/Jularr.E2E.Tests/)' || true)"
          if grep -Eq '^(src/|tests/Jularr.Backend.Tests/|database/|scripts/|[^/]+[.]sln$|NuGet[.]Config$|[.]github/(actions/|workflows/backend(-pr)?[.]yml$))|[.](props|targets)$' <<< "$backend_files"; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-dotnet@v6
        if: steps.paths.outputs.backend == 'true'
        with:
          dotnet-version: 10.0.403
      - uses: actions/cache@v6
        if: steps.paths.outputs.backend == 'true'
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - uses: actions/setup-node@v7
        if: steps.paths.outputs.backend == 'true'
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: src/Jularr.Frontend/package-lock.json
      - name: Verify the CI scripts (test shards and selection)
        if: steps.paths.outputs.backend == 'true'
        run: |
          python3 scripts/ci-shard-tests.py --self-test
          python3 scripts/ci-select-backend-tests.py --self-test
          python3 scripts/ci-classify-failure.py --self-test
      # Never fails: without a token, run or artifact the plan uses tests/ci-durations.json (the log says which).
      - name: Fetch the measured test durations of recent main runs
        if: steps.paths.outputs.backend == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: python3 scripts/ci-shard-tests.py fetch --repo "${REPOSITORY}" --out "${RUNNER_TEMP}/measured"
      - name: Compile assets required by Razor tests
        if: steps.paths.outputs.backend == 'true'
        working-directory: src/Jularr.Frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Compile the backend test project and its dependencies
        if: steps.paths.outputs.backend == 'true'
        run: dotnet build tests/Jularr.Backend.Tests --configuration Release
      - name: Select the tests for the changed areas and run the smoke methods
        id: select
        if: steps.paths.outputs.backend == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          selection="$(python3 scripts/ci-select-backend-tests.py "$BASE_SHA" "$HEAD_SHA" --json)"
          echo "classes=$(jq -r '.classes | join(",")' <<< "$selection")" >> "$GITHUB_OUTPUT"
          methods="$(jq -r '.methods' <<< "$selection")"
          if [[ -n "$methods" ]]; then
            # Download storage refuses tmpfs and overlay folders: test folders lie on the runner disk.
            export TMPDIR="${RUNNER_TEMP}"
            findmnt -T "${TMPDIR}" -o TARGET,FSTYPE,SOURCE || true
            dotnet test tests/Jularr.Backend.Tests --configuration Release --no-build ${DOTNET_TEST_BLAME} \
              --filter "$methods" --logger "trx;LogFileName=backend-pr-smoke.trx" \
              --results-directory TestResults/ci/fast
          fi
      # One plan for all shards (shipped in the build): the fewest shards, at most 6, whose slowest
      # lane is planned at up to 330 s, so a shard ends well within its 12 minutes. The real-tool tests
      # and the Full-only tests (ci-select-backend-tests.py --pr-exclude) run only in Backend Full.
      - name: Plan the test shards
        id: plan
        if: steps.select.outputs.classes != ''
        env:
          CLASSES: ${{ steps.select.outputs.classes }}
        shell: bash
        run: |
          set -euo pipefail
          matrix="$(python3 scripts/ci-shard-tests.py matrix --kind backend --lanes 2 --lane-limit 330 --max-shards 6 \
            --classes "${CLASSES}" --exclude "$(python3 scripts/ci-select-backend-tests.py --pr-exclude)" \
            --measured "${RUNNER_TEMP}/measured" --out ci-plan/backend.json)"
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/pack-build
        if: steps.select.outputs.classes != ''
      - name: Keep smoke test results
        if: always() && steps.paths.outputs.backend == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: backend-pr-smoke
          path: TestResults/ci/fast/*.trx
          if-no-files-found: ignore
          retention-days: 7
      - name: Keep the hang and crash evidence
        if: failure() && steps.paths.outputs.backend == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: blame-pr-prepare
          path: |
            TestResults/ci/**/Sequence_*.xml
            TestResults/ci/**/*.dmp
            !TestResults/ci/**/In/**
          if-no-files-found: ignore
          retention-days: 2

  # The selected tests of the changed areas as planned by `prepare` (ci-plan/backend.json): packed by
  # measured seconds per test, a long class split by method, two test processes each. They start only
  # when `prepare` (smoke) is green. A failing shard does not cancel the others (fail-fast off), so one
  # run reports every failing test.
  shards:
    name: backend (${{ matrix.shard }})
    needs: prepare
    if: needs.prepare.outputs.classes != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix || '{"include":[{"shard":"1/1"}]}') }}
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: jularr_test
          POSTGRES_PASSWORD: isolated-test-password
          POSTGRES_DB: jularr_test_admin
        ports:
          - 15433:5432
        options: >-
          --health-cmd "pg_isready -U jularr_test -d jularr_test_admin"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 60
    env:
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/actions
          persist-credentials: false
      - uses: ./.github/actions/restore-build
      # Backup integration requires pg_dump with the same major as PostgreSQL; the DjVu tests draw with DjVuLibre.
      - uses: ./.github/actions/install-tools
        with:
          djvulibre: 'true'
      - name: Run the selected test classes of this shard
        shell: bash
        run: |
          set -uo pipefail
          # Parallel dotnet test launches share one ready runtime directory. Without
          # initialization the NuGet-Migrations mutex can race in /run/user/.../shm.
          export XDG_RUNTIME_DIR="${RUNNER_TEMP}/jularr-dotnet-runtime"
          install -d -m 0700 "${XDG_RUNTIME_DIR}" "${XDG_RUNTIME_DIR}/.dotnet" "${XDG_RUNTIME_DIR}/.dotnet/shm"
          # Download storage refuses tmpfs and overlay folders: test folders lie on the runner disk.
          export TMPDIR="${RUNNER_TEMP}"
          findmnt -T "${TMPDIR}" -o TARGET,FSTYPE,SOURCE || true
          dotnet --info >/dev/null
          python3 scripts/ci-shard-tests.py lanes --plan ci-plan/backend.json --shard "${SHARD}" > "${RUNNER_TEMP}/lanes.txt" || exit 1
          mapfile -t lanes < "${RUNNER_TEMP}/lanes.txt"
          pids=()
          for index in "${!lanes[@]}"; do
            [[ -n "${lanes[$index]}" ]] || continue
            lane=$((index + 1))
            (set -o pipefail
             dotnet test tests/Jularr.Backend.Tests --configuration Release --no-build ${DOTNET_TEST_BLAME} \
               --filter "${lanes[$index]}" --logger "trx;LogFileName=backend-pr-lane${lane}.trx" \
               --results-directory TestResults/ci/fast 2>&1 | sed -u "s/^/[lane${lane}] /") &
            pids+=($!)
          done
          failed=0
          for pid in "${pids[@]}"; do wait "${pid}" || failed=1; done
          if [[ "${failed}" -ne 0 ]]; then
            echo "::error::Backend shard ${SHARD}: a test lane failed (lines are prefixed [lane1] / [lane2])."
            exit 1
          fi
        env:
          JULARR_TEST_DJVULIBRE: /usr/bin
      - name: Keep test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-pr-shard-${{ strategy.job-index }}
          path: TestResults/ci/fast/*.trx
          if-no-files-found: ignore
          retention-days: 7
      - name: Keep the hang and crash evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: blame-pr-shard-${{ strategy.job-index }}
          path: |
            TestResults/ci/**/Sequence_*.xml
            TestResults/ci/**/*.dmp
            !TestResults/ci/**/In/**
          if-no-files-found: ignore
          retention-days: 2

  # The stable required check `Backend / test`: one conclusion for prepare and all shards.
  test:
    needs: [prepare, shards, full-regression]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require prepare and the shards
        env:
          PREPARE: ${{ needs.prepare.result }}
          SHARDS: ${{ needs.shards.result }}
          FULL: ${{ needs.full-regression.result }}
        run: |
          echo "prepare: ${PREPARE}, shards: ${SHARDS}, full: ${FULL}"
          if [[ "${PREPARE}" != "success" || ( "${SHARDS}" != "success" && "${SHARDS}" != "skipped" ) || ( "${FULL}" != "success" && "${FULL}" != "skipped" ) ]]; then
            echo "::error::Backend PR check failed (prepare ${PREPARE}, shards ${SHARDS}). The failed job is named prepare, backend (shard) or full-regression."
            exit 1
          fi

  # An opted-in full run replaces (rather than duplicates) the fast backend build.
  full-regression:
    if: ${{ !github.event.pull_request.draft && contains(github.event.pull_request.labels.*.name, 'ci/full') }}
    uses: ./.github/workflows/backend.yml
    permissions:
      contents: read
      actions: read  # its build job plans the shards from the timings of the last finished main runs
