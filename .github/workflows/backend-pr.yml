            exit 1
          fi

  # Full regression runs only if requested; ordinary PRs do not get separate Full runs.
  full-regression:
    if: ${{ !github.event.pull_request.draft && (contains(github.event.pull_request.labels.*.name, 'ci/full') || contains(github.event.pull_request.title, '[full-ci]')) }}
    uses: ./.github/workflows/backend.yml
    permissions:
      contents: read
