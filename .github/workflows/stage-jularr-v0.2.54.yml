name: Stage Jularr v0.2.54 (one time)

# A one-time bridge: the GitHub App connector cannot create Git tag refs directly.
# Only tag the already-reviewed, fully tested merge commit and explicitly dispatch Release.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stage-jularr-v0.2.54.yml'

permissions:
  contents: write
  actions: write

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify merged commit and CI, tag v0.2.54, dispatch Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TARGET_SHA: 65b2684cd9e0b1a504ff0898680c9734b5ed9df5
          TAG: v0.2.54
        shell: bash
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)"
          relation="$(gh api "repos/$GH_REPO/compare/$TARGET_SHA...$main_sha" --jq .status)"
          if [[ "$relation" != "identical" && "$relation" != "ahead" ]]; then
            echo "::error::Target commit is not an ancestor of main."
            exit 1
          fi
          for workflow in "Frontend" "Backend Full"; do
            state="$(gh run list --commit "$TARGET_SHA" --workflow "$workflow" --limit 50 \
              --json status,conclusion,createdAt \
              --jq 'map(select(.status == "completed")) | sort_by(.createdAt) | last | .conclusion // "missing"')"
            if [[ "$state" != "success" ]]; then
              echo "::error::$workflow for $TARGET_SHA is $state, not success."
              exit 1
            fi
            echo "$workflow: success"
          done
          if gh api "repos/$GH_REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists; refusing to overwrite."
            exit 1
          fi
          gh api "repos/$GH_REPO/git/refs" -X POST \
            -f ref="refs/tags/$TAG" -f sha="$TARGET_SHA"
          # GITHUB_TOKEN-created tags do not automatically trigger tag-push workflows.
          gh workflow run release.yml --ref "$TAG" -f dry_run=false
          echo "Release dispatched for $TAG at $TARGET_SHA."
