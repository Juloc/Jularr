name: Authorship

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: authorship-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/dev' }}

jobs:
  authorship:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify contributor identities and commit trailers
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            # The event's base SHA can predate target-branch fast-forwards.
            # Checkout fetched all branches; verify every commit outside that actual target.
            current_base="$(git rev-parse --verify "refs/remotes/origin/${BASE_REF}")"
            range="${current_base}..${HEAD_SHA}"
          elif [[ -n "${BASE_SHA}" && ! "${BASE_SHA}" =~ ^0+$ ]]; then
            range="${BASE_SHA}..${HEAD_SHA}"
          else
            range="${HEAD_SHA}"
          fi
          bash scripts/verify-authorship.sh --range "${range}"
