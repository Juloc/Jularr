name: Image

# Container smoke for packaging/schema PRs; source-only PRs use the fast gates.
# All source changes are still checked in the assembled image after merge.

on:
  pull_request:
    branches: [main, dev]
    types: [opened, synchronize, reopened, converted_to_draft, ready_for_review]
    paths:
      - 'Dockerfile'
      - 'compose.yaml'
      - '.dockerignore'
      - 'database/**'
      - 'deploy/browser/**'
      - '.github/workflows/image.yml'
  push:
    branches: [main, dev]
    paths:
      - 'Dockerfile'
      - 'compose.yaml'
      - '.dockerignore'
      - 'database/**'
      - 'deploy/browser/**'
      - 'src/**'
      - '.github/workflows/image.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  minimal-compose:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # Local builds are faster here than exporting gigabytes of remote layer cache.
      # Docker Compose still validates the exact image this job just built.
      - name: Build the image
        run: docker build --tag ghcr.io/juloc/jularr:ci .
      - name: Start the shipped compose.yaml with nothing but its variables
        env:
          JULARR_VERSION: ci
          JULARR_DB_PASSWORD: ci-only-database-password
        run: |
          mkdir -p media
          docker compose up --detach --wait --wait-timeout 120 postgres
          docker compose up --detach jularr
          for attempt in $(seq 1 60); do
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8097/Setup || true)
            if [ "$status" = "200" ]; then break; fi
            sleep 2
          done
          docker compose logs jularr | tail -50
          test "$status" = "200"
          curl --silent http://127.0.0.1:8097/Setup | grep -q 'name="PasswordConfirmation"'
          docker compose exec -T jularr sh -c 'test -d /data/keys && ls /data'
      - name: Install, launch and completely remove browser as the unprivileged app
        env:
          JULARR_VERSION: ci
          JULARR_DB_PASSWORD: ci-only-database-password
        run: |
          docker compose exec -T jularr sh -ec '
            test "$(id -un)" = "app"
            jularr-browser install
            test -x /data/browser/runtime/chrome-linux64/chrome
            jularr-browser run > /tmp/browser-smoke.log 2>&1 &
            runner=$!
            trap "kill $runner 2>/dev/null || true; wait $runner 2>/dev/null || true" EXIT
            ready=0
            for attempt in $(seq 1 45); do
              if curl --fail --silent http://127.0.0.1:9222/json/version >/dev/null 2>&1; then ready=1; break; fi
              sleep 1
            done
            if [ "$ready" != 1 ]; then cat /tmp/browser-smoke.log; exit 1; fi
            kill "$runner"
            wait "$runner" || true
            trap - EXIT
            jularr-browser uninstall
            test ! -e /data/browser/runtime
            test ! -e /data/browser/profile
            test ! -e /data/browser/downloads
            test ! -e /data/browser/cache
            test ! -e /data/browser/config
            test ! -e /data/browser/tmp
          '

