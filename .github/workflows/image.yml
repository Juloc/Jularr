name: Image

# Container smoke for packaging/schema PRs; source-only PRs use the fast gates.
# All source changes are still checked in the assembled image after merge.

on:
  pull_request:
    branches: [main, dev]
    types: [opened, synchronize, reopened, converted_to_draft, ready_for_review]
    paths:
      - 'Dockerfile'
      - 'compose.yaml'
      - '.dockerignore'
      - 'database/**'
      - '.github/workflows/image.yml'
  push:
    branches: [main, dev]
    paths:
      - 'Dockerfile'
      - 'compose.yaml'
      - '.dockerignore'
      - 'database/**'
      - 'src/**'
      - '.github/workflows/image.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  minimal-compose:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DOCKER_BUILD_RECORD_UPLOAD: 'false'  # no build record artifact per build; the job summary still shows it
    steps:
      - uses: actions/checkout@v7
      # The release image (release.yml: same Dockerfile and platform; only the version differs). Docker Compose
      # still validates the exact image this job just built.
      - uses: docker/setup-buildx-action@v4
      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ghcr.io/juloc/jularr:ci
          cache-from: type=gha,scope=jularr-runtime-base
      # A tag reads caches of main only: the release builds its tool layers from this one and writes none. Only the
      # stage runtime-base (base image and tools, about 0.4 GB, new only when they change) is kept, not the app
      # layer of every commit. Its layers are already built above. A failed cache upload only warns: the image is fine.
      - name: Keep the runtime base layers for the release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          target: runtime-base
          cache-to: type=gha,mode=min,scope=jularr-runtime-base,ignore-error=true
      - name: Download the managed Chrome version for the runtime check
        run: |
          version=$(curl --fail --silent --show-error --retry 3 https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions.json | python3 -c 'import json,sys; print(json.load(sys.stdin)["channels"]["Stable"]["version"])')
          curl --fail --silent --show-error --location --retry 3 \
            "https://storage.googleapis.com/chrome-for-testing-public/${version}/linux64/chrome-linux64.zip" \
            --output "${RUNNER_TEMP}/chrome-linux64.zip"
          unzip -q "${RUNNER_TEMP}/chrome-linux64.zip" -d "${RUNNER_TEMP}/jularr-chrome"
      - name: Start the shipped compose.yaml with nothing but its variables
        env:
          JULARR_VERSION: ci
          JULARR_DB_PASSWORD: ci-only-database-password
        run: |
          mkdir -p media
          docker compose up --detach --wait --wait-timeout 120 postgres
          docker compose up --detach jularr
          for _ in $(seq 1 60); do
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8097/Setup || true)
            if [ "$status" = "200" ]; then break; fi
            sleep 2
          done
          docker compose logs jularr | tail -50
          test "$status" = "200"
          curl --silent http://127.0.0.1:8097/Setup | grep -q 'name="PasswordConfirmation"'
          docker compose exec -T jularr sh -c 'test -d /data/keys && ls /data'
      - name: Verify managed Chrome dependencies as the application user
        env:
          JULARR_VERSION: ci
          JULARR_DB_PASSWORD: ci-only-database-password
        run: |
          docker compose cp "${RUNNER_TEMP}/jularr-chrome/chrome-linux64" jularr:/tmp/chrome-runtime-check
          docker compose exec -T jularr sh -c 'test "$(id -u)" -ne 0 && /tmp/chrome-runtime-check/chrome --version'
      - name: Healthy only once it serves, tini as PID 1, and a clean stop within the budget
        env:
          JULARR_VERSION: ci
          JULARR_DB_PASSWORD: ci-only-database-password
        run: |
          container=$(docker compose ps -q jularr)
          for _ in $(seq 1 60); do
            health=$(docker inspect --format '{{.State.Health.Status}}' "$container")
            if [ "$health" = "healthy" ]; then break; fi
            sleep 2
          done
          test "$health" = "healthy"
          curl --fail --silent --show-error http://127.0.0.1:8097/health/live
          test "$(docker compose exec -T jularr cat /proc/1/comm)" = "tini"
          start=$(date +%s)
          docker compose stop jularr
          took=$(( $(date +%s) - start ))
          docker compose logs jularr | tail -20
          test "$(docker inspect --format '{{.State.ExitCode}}' "$container")" = "0"
          test "$took" -lt 20
