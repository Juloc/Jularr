name: Image

on:
  pull_request:
    paths:
      - 'Dockerfile'
      - 'compose.yaml'
      - '.dockerignore'
      - 'database/**'
      - 'src/**'
      - '.github/workflows/image.yml'
  push:
    branches: [clean-start]
    paths:
      - 'Dockerfile'
      - 'compose.yaml'
      - '.dockerignore'
      - 'database/**'
      - 'src/**'
      - '.github/workflows/image.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  minimal-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ghcr.io/juloc/jularr:ci
          cache-from: type=gha,scope=jularr-image
          cache-to: type=gha,scope=jularr-image,mode=max,ignore-error=true
      - name: Start the shipped compose.yaml with nothing but its variables
        env:
          JULARR_VERSION: ci
          JULARR_DB_PASSWORD: ci-only-database-password
        run: |
          mkdir -p media
          docker compose up --detach --wait --wait-timeout 120 postgres
          docker compose up --detach jularr
          for attempt in $(seq 1 60); do
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8097/Setup || true)
            if [ "$status" = "200" ]; then break; fi
            sleep 2
          done
          docker compose logs jularr | tail -50
          test "$status" = "200"
          curl --silent http://127.0.0.1:8097/Setup | grep -q 'name="PasswordConfirmation"'
          docker compose exec -T jularr sh -c 'test -d /data/keys && ls /data'
