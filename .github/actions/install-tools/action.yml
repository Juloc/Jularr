name: Install the test tools
description: >-
  The PostgreSQL 18 client (pg_dump matches the test database major; backups are part of the tests),
  and when asked cjxl (libjxl-tools, small, from apt), DjVuLibre (djvulibre-bin, small, from apt) and FFmpeg. FFmpeg is NOT installed with apt: its
  dependency set is large and downloading it from the hosted mirrors stalled for minutes. CI uses the FFmpeg line production
  runs (the image installs jellyfin-ffmpeg7): one pinned jellyfin-ffmpeg 7 portable build, checked by sha256 and cached
  between runs.

inputs:
  ffmpeg:
    description: Install FFmpeg and ffprobe (pinned jellyfin-ffmpeg 7 portable build, installed into /usr/bin)
    default: 'false'
  cjxl:
    description: Install cjxl (libjxl-tools)
    default: 'false'
  djvulibre:
    description: Install DjVuLibre (djvulibre-bin; ddjvu, djvused and the encoders the DjVu tests make their books with)
    default: 'false'

runs:
  using: composite
  steps:
    # The verified archive is cached, not the unpacked binaries: every job checks it with sha256sum -c.
    # Keep the version in this key equal to FFMPEG_VERSION below.
    - name: Cache the pinned FFmpeg archive
      if: inputs.ffmpeg == 'true'
      uses: actions/cache@v6
      with:
        path: ~/jellyfin-ffmpeg
        key: jellyfin-ffmpeg-7.1.4-3

    - name: Install FFmpeg (pinned jellyfin-ffmpeg 7)
      if: inputs.ffmpeg == 'true'
      shell: bash
      env:
        # A new version: take version and sha256 (the release asset's digest) from
        # https://github.com/jellyfin/jellyfin-ffmpeg/releases, change both and the cache key together.
        FFMPEG_VERSION: 7.1.4-3
        FFMPEG_SHA256: cab9ff40a47e4232d231e4eb7e4e85fabfeec56c6905266bc94291fc0881f83f
      run: |
        set -euo pipefail
        dir="${HOME}/jellyfin-ffmpeg"
        name="jellyfin-ffmpeg_${FFMPEG_VERSION}_portable_linux64-gpl.tar.xz"
        archive="${dir}/${name}"
        url="https://github.com/jellyfin/jellyfin-ffmpeg/releases/download/v${FFMPEG_VERSION}/${name}"
        verify() { echo "${FFMPEG_SHA256}  ${archive}" | sha256sum -c -; }
        mkdir -p "${dir}"
        if [[ ! -f "${archive}" ]] || ! verify; then
          rm -f "${archive}"
          for attempt in 1 2 3; do
            if curl -fsSL --retry 3 --retry-delay 3 --connect-timeout 20 --max-time 240 "${url}" -o "${archive}" && verify; then break; fi
            rm -f "${archive}"
            echo "::warning::FFmpeg download attempt ${attempt} failed or did not match its sha256; retrying"
            [[ "${attempt}" -lt 3 ]] || { echo "::error::The pinned jellyfin-ffmpeg ${FFMPEG_VERSION} could not be downloaded and verified."; exit 1; }
            sleep 5
          done
        fi
        unpacked="${RUNNER_TEMP}/jellyfin-ffmpeg"
        rm -rf "${unpacked}"
        mkdir -p "${unpacked}"
        tar -xJf "${archive}" -C "${unpacked}"
        ffmpeg="$(find "${unpacked}" -type f -name ffmpeg -print -quit)"
        ffprobe="$(find "${unpacked}" -type f -name ffprobe -print -quit)"
        if [[ -z "${ffmpeg}" || -z "${ffprobe}" ]]; then
          echo "::error::${name} holds no ffmpeg and ffprobe."
          exit 1
        fi
        sudo install -m 0755 "${ffmpeg}" /usr/bin/ffmpeg
        sudo install -m 0755 "${ffprobe}" /usr/bin/ffprobe
        /usr/bin/ffmpeg -version | head -1
        /usr/bin/ffprobe -version | head -1

    - name: Install the PostgreSQL client and cjxl
      shell: bash
      env:
        WITH_CJXL: ${{ inputs.cjxl }}
        WITH_DJVULIBRE: ${{ inputs.djvulibre }}
      run: |
        set -euo pipefail
        # apt on hosted runners can stall (IPv6, a slow mirror): IPv4 is forced, every command has a time
        # limit and the install is retried instead of hanging for minutes.
        apt_opts=(-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Acquire::ForceIPv4=true -o Dpkg::Use-Pty=0)
        sudo install -d -m 0755 /usr/share/postgresql-common/pgdg
        curl -fsSL --retry 3 --retry-delay 2 --max-time 30 https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc >/dev/null
        echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo "${VERSION_CODENAME}")-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
        packages=(postgresql-client-18)
        if [[ "${WITH_CJXL}" == "true" ]]; then packages+=(libjxl-tools); fi
        if [[ "${WITH_DJVULIBRE}" == "true" ]]; then packages+=(djvulibre-bin); fi
        installed=false
        for attempt in 1 2 3; do
          if sudo timeout 90 apt-get update -qq "${apt_opts[@]}" && sudo env DEBIAN_FRONTEND=noninteractive timeout 150 apt-get install -qq --yes --no-install-recommends "${apt_opts[@]}" "${packages[@]}"; then
            installed=true
            break
          fi
          echo "::warning::apt attempt ${attempt} failed or timed out; retrying"
          sudo dpkg --configure -a || true
          sleep 5
        done
        if [[ "${installed}" != "true" ]]; then
          echo "::error::Installing the test tools failed three times."
          exit 1
        fi
        echo "/usr/lib/postgresql/18/bin" >> "${GITHUB_PATH}"
        /usr/lib/postgresql/18/bin/pg_dump --version
