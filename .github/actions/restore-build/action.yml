name: Restore the shared build
description: >-
  Unpacks the workspace that the build job compiled once (sources, bin/obj, compiled frontend
  assets, the shard plans in ci-plan/) so a test job runs `dotnet test --no-build` without compiling
  again. No NuGet cache: the test outputs carry every assembly they load, and the NuGet imports of a
  project file only apply when they exist.

runs:
  using: composite
  steps:
    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.403
    - uses: actions/download-artifact@v8
      with:
        name: jularr-build
        path: ${{ runner.temp }}/jularr-build
    - name: Unpack the build into the workspace
      shell: bash
      run: |
        tar -xzf "${RUNNER_TEMP}/jularr-build/jularr-build.tgz" -C "${GITHUB_WORKSPACE}"
        rm -f "${RUNNER_TEMP}/jularr-build/jularr-build.tgz"
        echo "NuGet package folder: $(ls -d ~/.nuget/packages 2>/dev/null || echo 'none (not needed)')"
